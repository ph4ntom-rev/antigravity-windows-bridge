<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #222;
    }
    .header h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.on  { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
    .dot.off { background: #ef4444; box-shadow: 0 0 6px #ef444488; }
    .row {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      padding: 4px 0;
      color: #999;
    }
    .row span:last-child { color: #ccc; font-weight: 500; }
    .err {
      margin-top: 8px;
      font-size: 10px;
      color: #f87171;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="dot" id="dot"></div>
    <h1>ANTIGRAVITY BRIDGE</h1>
  </div>
  <div class="row"><span>Status</span><span id="status">—</span></div>
  <div class="row"><span>Commands</span><span id="cmds">0</span></div>
  <div class="err" id="err"></div>
  <label for="token">Pairing token</label>
  <input id="token" type="password" autocomplete="off" placeholder="Paste extension-token">
  <button id="pair">Save pairing</button>
  <script src="popup.js"></script>
</body>
</html>
