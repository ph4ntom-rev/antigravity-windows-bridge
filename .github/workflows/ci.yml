name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q -x '[\\/]\.venv[\\/]' .
      - run: python -m pytest -q
      - run: node --check chrome_extension/background.js
      - run: node --check chrome_extension/popup.js
